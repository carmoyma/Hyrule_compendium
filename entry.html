<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entry Details</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1 id="entry-name"></h1>
    <div id="entry-details">
        <img id="entry-image" src="" alt="Entry Image">
        <p id="entry-description"></p>

        <h2>Drops / Properties:</h2>
        <ul id="entry-extra"></ul>

        <button id="go-back-btn">Go Back</button>
    </div>
    <div id="particle-bg">
        <div class="particle" style="left: 10%; animation-delay: 4s;"></div>
        <div class="particle" style="left: 20%; animation-delay: 1s;"></div>
        <div class="particle" style="left: 35%; animation-delay: 3s;"></div>
        <div class="particle" style="left: 50%; animation-delay: 2s;"></div>
        <div class="particle" style="left: 70%; animation-delay: 0s;"></div>
        <div class="particle" style="left: 85%; animation-delay: 5s;"></div>
    </div>
    <script src="entry.js"></script>
</body>
</html>
